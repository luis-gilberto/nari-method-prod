<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signal Drop · CSC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/workspace.css" />
  <style>
    :root {
      --font-display: 'Cormorant Garamond', serif;
      --font-body: 'DM Sans', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    body {
      background: #0e0b12;
    }
    .sd-shell {
      max-width: 980px;
      margin: 0 auto;
      padding: clamp(32px, 6vw, 88px) clamp(20px, 5vw, 72px);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      gap: clamp(24px, 3vw, 40px);
    }
    .sd-label {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      font-size: 12px;
      color: var(--text-muted);
    }
    .sd-title {
      margin-top: 14px;
      font-family: var(--font-display);
      font-weight: 300;
      line-height: 1.05;
      font-size: clamp(42px, 5vw, 74px);
      color: var(--text-primary);
    }
    .sd-subcopy {
      margin-top: 12px;
      max-width: 62ch;
      font-size: 16px;
      color: var(--text-secondary);
    }
    .sd-input {
      display: flex;
      flex-direction: column;
      gap: 18px;
      margin-top: 6px;
    }
    .sd-textarea {
      width: 100%;
      min-height: clamp(220px, 34vh, 360px);
      padding: 18px 18px;
      border-radius: var(--r-lg);
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.02);
      color: var(--text-primary);
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.6;
      resize: vertical;
      outline: none;
      transition: border-color var(--transition), background var(--transition);
    }
    .sd-textarea::placeholder {
      color: var(--text-dim);
    }
    .sd-textarea:focus {
      border-color: var(--border-strong);
      background: rgba(255,255,255,0.03);
    }
    .sd-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 2px;
    }
    .sd-chip {
      border: 1px solid var(--border);
      border-radius: var(--r-pill);
      padding: 10px 14px;
      font-size: 13px;
      color: var(--text-secondary);
      background: rgba(255,255,255,0.015);
      transition: background var(--transition), border-color var(--transition), color var(--transition);
    }
    .sd-chip:hover {
      border-color: var(--border-strong);
      color: var(--text-primary);
    }
    .sd-chip.is-selected {
      border-color: rgba(249,111,110,0.55);
      background: rgba(249,111,110,0.10);
      color: var(--text-primary);
    }
    .sd-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      margin-top: 6px;
    }
    .sd-drop {
      border: 1px solid var(--border);
      border-radius: var(--r-pill);
      padding: 12px 16px;
      font-size: 13px;
      color: var(--text-primary);
      background: rgba(255,255,255,0.015);
      transition: background var(--transition), border-color var(--transition), transform var(--transition);
    }
    .sd-drop:hover {
      border-color: var(--border-strong);
      background: rgba(255,255,255,0.03);
      transform: translateY(-1px);
    }
    .sd-drop:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }
    .sd-hint {
      font-size: 12px;
      color: var(--text-dim);
      letter-spacing: 0.02em;
      white-space: nowrap;
    }
    .sd-log {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
    }
    .sd-log-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .sd-log-item {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      color: var(--text-muted);
      font-size: 13px;
    }
    .sd-log-ts {
      color: var(--text-dim);
      font-variant-numeric: tabular-nums;
    }
    .sd-log-type {
      color: var(--text-secondary);
    }
    .sd-log-note {
      color: var(--text-muted);
    }
    @media (max-width: 520px) {
      .sd-subcopy {
        font-size: 15px;
      }
      .sd-textarea {
        padding: 16px;
      }
      .sd-chip {
        padding: 10px 12px;
      }
      .sd-actions {
        flex-direction: column;
        align-items: flex-start;
      }
      .sd-hint {
        white-space: normal;
      }
    }
  </style>
</head>
<body>
  <main class="sd-shell">
    <header class="sd-header">
      <div class="sd-label">SIGNAL DROP · CSC</div>
      <h1 class="sd-title">Raw thoughts belong somewhere.</h1>
      <p class="sd-subcopy">This is where intuition enters the system before translation.</p>
    </header>

    <section class="sd-input" aria-label="Signal input">
      <textarea class="sd-textarea" id="signalText" placeholder="Paste thoughts, links, observations, transcripts..."></textarea>
      <div class="sd-chips" role="group" aria-label="Signal type">
        <button type="button" class="sd-chip is-selected" aria-pressed="true">Documentary</button>
        <button type="button" class="sd-chip" aria-pressed="false">Audience Signal</button>
        <button type="button" class="sd-chip" aria-pressed="false">Voice Note</button>
        <button type="button" class="sd-chip" aria-pressed="false">Content Idea</button>
        <button type="button" class="sd-chip" aria-pressed="false">Partnership</button>
        <button type="button" class="sd-chip" aria-pressed="false">Emotional Pattern</button>
      </div>
      <div class="sd-actions">
        <button type="button" class="sd-drop" id="dropBtn" disabled>Drop Signal</button>
        <div class="sd-hint">Ctrl/⌘ + Enter to drop</div>
      </div>
    </section>

    <section class="sd-log" aria-label="Signal log">
      <div class="sd-log-list" id="logList"></div>
    </section>
  </main>

  <script>
    (() => {
      window.addEventListener('pageshow', (event) => {
        if (event.persisted) window.location.reload();
      });

      const chips = Array.from(document.querySelectorAll('.sd-chip'));
      const setSelected = (selected) => {
        chips.forEach((btn) => {
          const on = btn === selected;
          btn.classList.toggle('is-selected', on);
          btn.setAttribute('aria-pressed', String(on));
        });
      };
      chips.forEach((btn) => btn.addEventListener('click', () => setSelected(btn)));

      const storageKey = 'csc_signal_drop_v1';
      const textarea = document.getElementById('signalText');
      const dropBtn = document.getElementById('dropBtn');
      const logList = document.getElementById('logList');

      const getSelectedType = () => {
        const selected = document.querySelector('.sd-chip.is-selected');
        return selected ? selected.textContent.trim() : 'Documentary';
      };

      const loadEntries = () => {
        try {
          const raw = window.localStorage.getItem(storageKey);
          const parsed = raw ? JSON.parse(raw) : [];
          return Array.isArray(parsed) ? parsed : [];
        } catch {
          return [];
        }
      };

      const saveEntries = (entries) => {
        window.localStorage.setItem(storageKey, JSON.stringify(entries));
      };

      const formatTimestamp = (iso) => {
        const d = new Date(iso);
        if (Number.isNaN(d.getTime())) return iso;
        return new Intl.DateTimeFormat('en-US', {
          year: 'numeric',
          month: '2-digit',
          day: '2-digit',
          hour: '2-digit',
          minute: '2-digit',
          hour12: false
        }).format(d);
      };

      const makePreview = (text) => {
        const oneLine = text.replace(/\s+/g, ' ').trim();
        if (!oneLine) return '[Empty]';
        if (oneLine.length <= 84) return oneLine;
        return `${oneLine.slice(0, 84).trim()}…`;
      };

      const renderLog = () => {
        const entries = loadEntries();
        logList.innerHTML = '';

        const items = entries.length
          ? entries
          : [
              { ts: '[Timestamp]', type: '[Type]', text: '[Short Note placeholder]' },
              { ts: '[Timestamp]', type: '[Type]', text: '[Short Note placeholder]' },
              { ts: '[Timestamp]', type: '[Type]', text: '[Short Note placeholder]' }
            ];

        items.forEach((entry) => {
          const row = document.createElement('div');
          row.className = 'sd-log-item';

          const ts = document.createElement('span');
          ts.className = 'sd-log-ts';
          ts.textContent = entry.ts.startsWith('[') ? entry.ts : formatTimestamp(entry.ts);

          const dot1 = document.createElement('span');
          dot1.setAttribute('aria-hidden', 'true');
          dot1.textContent = '·';

          const type = document.createElement('span');
          type.className = 'sd-log-type';
          type.textContent = entry.type;

          const dot2 = document.createElement('span');
          dot2.setAttribute('aria-hidden', 'true');
          dot2.textContent = '·';

          const note = document.createElement('span');
          note.className = 'sd-log-note';
          note.textContent = entry.text.startsWith('[') ? entry.text : makePreview(entry.text);

          row.append(ts, dot1, type, dot2, note);
          logList.appendChild(row);
        });
      };

      const updateButtonState = () => {
        dropBtn.disabled = textarea.value.trim().length === 0;
      };

      const dropSignal = () => {
        const text = textarea.value.trim();
        if (!text) return;

        const entries = loadEntries();
        entries.unshift({ ts: new Date().toISOString(), type: getSelectedType(), text });
        saveEntries(entries.slice(0, 200));
        textarea.value = '';
        updateButtonState();
        renderLog();
        textarea.focus();
      };

      textarea.addEventListener('input', updateButtonState);
      textarea.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
          e.preventDefault();
          dropSignal();
        }
      });
      dropBtn.addEventListener('click', dropSignal);
      updateButtonState();
      renderLog();

      const shouldLoadPlausible = (() => {
        const host = window.location.hostname;
        if (!host) return false;
        if (host === 'localhost' || host === '127.0.0.1' || host === '[::1]') return false;
        return host === 'criarsinculpas.com' || host.endsWith('.criarsinculpas.com');
      })();

      if (shouldLoadPlausible) {
        const script = document.createElement('script');
        script.defer = true;
        script.src = 'https://plausible.io/js/script.js';
        script.dataset.domain = 'criarsinculpas.com';
        document.head.appendChild(script);
      }
    })();
  </script>
</body>
</html>
